<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1748" height="2480" viewBox="0 0 1748 2480">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06162f" stop-opacity="0.20"/>
      <stop offset="0.58" stop-color="#071a3a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#041126" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c7e8"/>
      <stop offset="1" stop-color="#77e9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020a18" flood-opacity="0.42"/>
    </filter>
  </defs>

  <image x="0" y="0" width="1748" height="2480"
         preserveAspectRatio="xMidYMid slice" xlink:href="cover-background-v2.png"/>
  <rect width="1748" height="2480" fill="url(#shade)"/>

  <!-- Exact organization logos on a clean identity plate. -->
  <rect x="112" y="100" width="1524" height="300" rx="36"
        fill="#ffffff" fill-opacity="0.97" filter="url(#shadow)"/>
  <image x="170" y="128" width="690" height="243"
         preserveAspectRatio="xMinYMid meet" xlink:href="image1.png"/>
  <line x1="1035" y1="145" x2="1035" y2="355" stroke="#d9e8f1" stroke-width="3"/>
  <image x="1160" y="132" width="290" height="238"
         preserveAspectRatio="xMidYMid meet" xlink:href="image2.png"/>

  <!-- Editorial title block. -->
  <text x="128" y="600" font-family="Avenir Next, Helvetica, sans-serif"
        font-size="34" font-weight="600" letter-spacing="8" fill="#64def7">
    BUKU PELATIHAN PROFESIONAL
  </text>
  <rect x="128" y="636" width="204" height="9" rx="5" fill="url(#accent)"/>

  <text x="118" y="865" font-family="Avenir Next, Helvetica, sans-serif"
        font-size="196" font-weight="800" letter-spacing="2" fill="#ffffff">
    FLUTTER
  </text>
  <text x="128" y="1000" font-family="Avenir Next, Helvetica, sans-serif"
        font-size="78" font-weight="700" letter-spacing="7" fill="#79e8ff">
    ANDROID &amp; iOS
  </text>
  <text x="128" y="1100" font-family="Avenir Next, Helvetica, sans-serif"
        font-size="52" font-weight="500" fill="#ffffff">
    Dari UI hingga Release
  </text>
  <text x="128" y="1175" font-family="Avenir Next, Helvetica, sans-serif"
        font-size="30" font-weight="400" fill="#cfe8f4">
    Praktikum • Evaluasi • Proyek Inspeksi
  </text>

  <!-- Curriculum tags. -->
  <g font-family="Avenir Next, Helvetica, sans-serif" font-size="24" font-weight="600"
     letter-spacing="1" fill="#ffffff">
    <rect x="128" y="1260" width="196" height="64" rx="32" fill="#0b355f" stroke="#2cd3f1" stroke-width="2"/>
    <text x="171" y="1302">UI &amp; FORM</text>
    <rect x="344" y="1260" width="182" height="64" rx="32" fill="#0b355f" stroke="#2cd3f1" stroke-width="2"/>
    <text x="389" y="1302">REST API</text>
    <rect x="546" y="1260" width="156" height="64" rx="32" fill="#0b355f" stroke="#2cd3f1" stroke-width="2"/>
    <text x="592" y="1302">STATE</text>
    <rect x="722" y="1260" width="190" height="64" rx="32" fill="#0b355f" stroke="#2cd3f1" stroke-width="2"/>
    <text x="762" y="1302">TESTING</text>
  </g>

  <!-- Program marker. -->
  <g transform="translate(128 1485)">
    <circle cx="56" cy="56" r="56" fill="#22c7e8"/>
    <text x="56" y="73" text-anchor="middle" font-family="Avenir Next, Helvetica, sans-serif"
          font-size="52" font-weight="800" fill="#05244c">3</text>
    <text x="142" y="47" font-family="Avenir Next, Helvetica, sans-serif"
          font-size="27" font-weight="600" letter-spacing="4" fill="#7beaff">PROGRAM INTENSIF</text>
    <text x="142" y="91" font-family="Avenir Next, Helvetica, sans-serif"
          font-size="38" font-weight="700" fill="#ffffff">HARI</text>
  </g>

  <!-- Author and edition plate. -->
  <rect x="112" y="2034" width="1524" height="302" rx="38"
        fill="#031126" fill-opacity="0.84" stroke="#27cbe9" stroke-opacity="0.72" stroke-width="3"/>
  <text x="170" y="2114" font-family="Avenir Next, Helvetica, sans-serif"
        font-size="24" font-weight="600" letter-spacing="5" fill="#66e2f8">TRAINER &amp; PENULIS</text>
  <text x="170" y="2195" font-family="Avenir Next, Helvetica, sans-serif"
        font-size="47" font-weight="700" fill="#ffffff">Damar Galih Aji Pradana, S.Tr.Kom.</text>
  <line x1="170" y1="2235" x2="1575" y2="2235" stroke="#2d7192" stroke-width="2"/>
  <text x="170" y="2292" font-family="Avenir Next, Helvetica, sans-serif"
        font-size="27" font-weight="500" fill="#d7edf5">PT. Dok Pantai Lamongan</text>
  <text x="1575" y="2292" text-anchor="end" font-family="Avenir Next, Helvetica, sans-serif"
        font-size="27" font-weight="500" fill="#d7edf5">Edisi Oktober 2026</text>
</svg>
