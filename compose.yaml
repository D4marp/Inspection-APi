services:
  inspection-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dpl-inspection-training-api:local
    container_name: dpl-inspection-api
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-3100}:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3100}
      CORS_ORIGIN: "*"
      TRAINING_USERNAME: trainer
      TRAINING_PASSWORD: training123
      TRAINING_TOKEN: training-demo-token
      ENABLE_FAULTS: "true"
      RESPONSE_DELAY_MS: 0
      FAIL_LIST: "false"
      FAIL_CREATE: "false"
      EMPTY_DATA: "false"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
